<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Smart App Banner STATICO: iOS lo mostra solo se presente nell'HTML iniziale.
     Tap su "APRI" → apre l'app PSA installata. -->
<meta name="apple-itunes-app" content="app-id=996239729">
<title>Apri in PSA — Sweethome</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@600;700&family=Outfit:wght@900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0a; --surface:#131313; --border:#2a2a2a; --text:#f5f2eb; --muted:#8a8478; --accent:#a855f7; --gold:#d4a847; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:var(--bg); }
  body {
    font-family:'Inter',-apple-system,sans-serif; color:var(--text);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; padding:30px 24px calc(env(safe-area-inset-bottom) + 30px);
    text-align:center;
  }
  .word { font-family:'Outfit',sans-serif; font-weight:900; font-size:1.3rem; letter-spacing:3px; text-transform:uppercase; }
  .word .s { color:var(--accent); }
  .badge { font-size:2.4rem; }
  .cert-label { font-size:0.62rem; letter-spacing:2px; text-transform:uppercase; color:var(--muted); font-family:'JetBrains Mono',monospace; }
  .cert { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:1.6rem; color:var(--gold); letter-spacing:1px; margin-top:4px; }
  .copied { font-size:0.66rem; color:var(--muted); font-family:'JetBrains Mono',monospace; margin-top:6px; opacity:0; transition:opacity 0.3s; }
  .copied.show { opacity:1; }
  .open-btn {
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; max-width:340px;
    background:linear-gradient(135deg,#a855f7,#7e22ce); color:#fff;
    border:none; border-radius:16px; padding:18px 24px;
    font-size:1.05rem; font-weight:700; font-family:'Inter',sans-serif;
    text-decoration:none;
    box-shadow:0 8px 28px rgba(168,85,247,0.4);
  }
  .open-btn:active { transform:scale(0.97); }
  .copy-btn {
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    border-radius:12px; padding:12px 20px; font-size:0.85rem; font-weight:600;
    font-family:'Inter',sans-serif; width:100%; max-width:340px;
  }
  .copy-btn:active { transform:scale(0.97); }
  .hint { font-size:0.72rem; color:var(--muted); line-height:1.7; max-width:320px; }
  .hint b { color:var(--text); font-weight:600; }
</style>
</head>
<body>
  <div class="word"><span class="s">S</span>WEETHOME</div>
  <div class="badge">🏅</div>
  <div>
    <div class="cert-label">Certificato PSA</div>
    <div class="cert" id="cert-num">—</div>
    <div class="copied" id="copied-msg">📋 seriale copiato negli appunti</div>
  </div>
  <a class="open-btn" id="open-link" href="https://www.psacard.com/cert">
    <span>🏅</span><span>Apri nell'app PSA</span>
  </a>
  <button class="copy-btn" id="copy-btn">📋 Copia seriale</button>
  <div class="hint">
    💡 <b>Tieni premuto</b> il bottone viola e scegli <b>"Apri in PSA"</b>:
    iOS ricorderà la scelta e d'ora in poi aprirà sempre l'app.<br>
    Oppure usa il banner <b>APRI</b> in alto.
  </div>
<script>
  (function(){
    var cert = (new URLSearchParams(location.search).get('cert') || '').replace(/[^0-9]/g, '');
    if (!cert) return;
    document.getElementById('cert-num').textContent = cert;
    document.getElementById('open-link').href = 'https://www.psacard.com/cert/' + cert;

    function copyCert(showMsg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(cert).then(function(){
          if (showMsg) document.getElementById('copied-msg').classList.add('show');
        }).catch(function(){});
      }
    }
    // tentativo di copia automatica (se iOS lo permette senza gesto)
    copyCert(true);
    document.getElementById('copy-btn').addEventListener('click', function(){
      copyCert(true);
      this.textContent = '✓ Copiato!';
    });
  })();
</script>
</body>
</html>
